<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app draw into the iPhone notch + home-indicator areas;
         CSS env(safe-area-inset-*) handles the actual padding. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF8F3" />
    <!-- iOS PWA / Capacitor status bar styling -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>NYC Stoop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 2026-08-26 redesign: Bricolage Grotesque (display) + Instrument Sans
         (interface), BUNDLED in /public/fonts — no network dependency, so the
         native app renders the brand type offline. Old Google Fonts link
         removed (Inter/Playfair are no longer referenced). -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Google Identity Services — renders the "Sign in with Google" button
         and returns an ID token to our callback. We verify it server-side. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
